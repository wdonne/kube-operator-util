[package]
name = "kube-operator-util"
version = "1.1.0"
edition = "2024"
description = "Utilities for Kubernetes operators"
homepage = "https://github.com/wdonne/kube-operator-util"
repository = "https://github.com/wdonne/kube-operator-util"
license = "BSD-2-Clause"
readme = "README.md"
keywords = ["kubernetes", "operator"]
exclude = ["*.iml"]

[dependencies]
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.44"
k8s-openapi = { version = "0.27.1", features = ["v1_31"] }
kube = { version = "3.1.0", features = ["runtime", "client"] }
log = "0.4.29"
kube-core = "3.1.0"
